[project]
name = "hibiki-mlx"
version = "0.1.0"
description = "Clean local MLX inference for Hibiki 1B French-to-English speech translation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.15"
authors = [{ name = "Hibiki Inference contributors" }]
keywords = ["hibiki", "mlx", "speech-translation", "apple-silicon"]
classifiers = [
    # The first version is deliberately not published to PyPI.
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# MLX ships Apple-silicon macOS wheels only. Keeping it unconditional makes an
# unsupported platform fail at install time instead of at first inference.
dependencies = [
    "mlx>=0.32.0,<0.33",
    "huggingface-hub>=0.34,<1.0",
    "numpy>=2.1",
    "sentencepiece>=0.2.0",
]

[project.urls]
Repository = "https://github.com/anthoai97/hibiki-inference"
Issues = "https://github.com/anthoai97/hibiki-inference/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hibiki_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quick tests are the default and need neither network access nor model weights.
# Model-backed tests are opt-in: `pytest -m model_backed`.
addopts = "-m 'not model_backed' --strict-markers"
markers = [
    "model_backed: requires the real ~4 GB artifact bundle (set HIBIKI_MLX_TEST_BUNDLE)",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["hibiki_mlx", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["huggingface_hub.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
