[project]
name = "hibiki-mlx"
version = "0.1.0"
description = "Clean local MLX inference for Hibiki speech translation"
readme = "README.md"
authors = [
    { name = "An Quach", email = "anquach.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.34,<1.0",
    "mlx>=0.26,<0.27",
    "numpy>=2.0",
    "sentencepiece>=0.2",
    "sphn>=0.1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
