<!doctype html>
<!--
  PROTOTYPE — THROWAWAY. Not production, not tested, do not ship.

  Question: what should the phone demo screen for a Hibiki inference run look like,
  in BOTH input modes — pick a checked-in WAV, or listen to the microphone?
  Four variants x two modes on one page, via ?variant= and ?mode=, plus the
  floating bar. Throwaway page because hibiki_mlx_swift has no page to embed in yet.

  Real data:
    * Every number in FILE mode is verbatim from the handed-over run of
      assets/long-form/2.wav through artifacts/hibiki-1b-mlx-bf16.
    * Both waveforms are the true per-80ms RMS envelope of 2.wav and output.wav.
    * The file picker lists all ten checked-in assets with their real duration,
      frame count and sample rate (the short-form set is 48 kHz and gets resampled).
    * LIVE mode drives the level meter from your actual microphone when you grant
      it, and falls back to replaying 2.wav's envelope when you do not.

  Deliberately visible gaps, not papered over:
    * There is no French transcript anywhere. Hibiki is speech-to-speech and never
      emits source text, so every source lane is level only.
    * Word timing is APPROXIMATE — the run printed the decoded English as one
      undelimited stream, so words are spread across the frames where the generated
      audio is voiced. Frame, step and timing counts are exact.
    * Per-step phase timings and memory are blank: that run had no --metrics.
    * LIVE mode does not exist in the CLI yet. session.push_pcm already buffers
      arbitrary-length chunks into 80 ms frames, so the model side is ready and only
      capture is missing — but every live-mode log line here is PROPOSED COPY, not
      output anyone has seen. Live throughput reuses the file run's 22.4 steps/s.
    * Only 2.wav has a baked run, so the other nine rows in the picker are inert.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibiki phone UI — prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #17171a;
    background-image: radial-gradient(120% 80% at 50% 0%, #2a2a31 0%, #14141a 60%, #0e0e12 100%);
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #eee;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 132px;
    overflow-x: hidden;
  }
  .stage-note {
    max-width: 500px; text-align: center; font-size: 12.5px; line-height: 1.55;
    color: #8b8b96; letter-spacing: .01em; margin: 0 0 20px;
  }
  .stage-note b { color: #c9c9d4; font-weight: 600; }
  .stage-note kbd {
    font: 600 11px/1 ui-monospace, Menlo, monospace; background: #26262e; color: #c9c9d4;
    padding: 2px 5px; border-radius: 4px;
  }

  /* ---------- shared: the device shell (the only chrome all variants share) ---------- */
  .fit { display: flex; justify-content: center; }
  .device {
    position: relative; width: 393px; height: 852px; flex: none;
    transform-origin: top center;
    border-radius: 54px; padding: 11px;
    background: linear-gradient(160deg, #4c4c56, #22222a 40%, #3a3a44);
    box-shadow: 0 40px 90px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.07);
  }
  .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    border-radius: 44px; background: #000;
    display: flex; flex-direction: column;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 116px; height: 33px; border-radius: 20px; background: #000; z-index: 40;
    pointer-events: none;
  }
  .statusbar {
    flex: none; height: 54px; display: flex; align-items: center;
    justify-content: space-between; padding: 14px 28px 0;
    font-size: 13.5px; font-weight: 600; letter-spacing: .02em; z-index: 30;
    color: var(--status, #fff);
  }
  .statusbar .glyphs { display: flex; gap: 5px; align-items: center; opacity: .9; }
  .statusbar .bar { width: 3px; border-radius: 1px; background: currentColor; }
  .view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }

  /* shared sheet mechanics — each variant styles its own contents */
  .sheet-wrap {
    position: absolute; inset: 0; z-index: 25; display: none;
    align-items: flex-end; background: rgba(0,0,0,.5);
  }
  .sheet-wrap.open { display: flex; }
  .sheet { width: 100%; max-height: 88%; overflow-y: auto; }

  /* ---------- shared: prototype switcher (deliberately ugly, not part of any design) ---------- */
  .switcher {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 999; display: flex; align-items: stretch; gap: 2px; flex-wrap: nowrap;
    background: #f4f4f6; color: #101014; border-radius: 999px; padding: 5px;
    box-shadow: 0 12px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.35);
    font: 600 12.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .switcher button {
    font: inherit; border: 0; background: transparent; color: inherit;
    padding: 9px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .switcher button:hover { background: #dfdfe4; }
  .switcher button.on { background: #101014; color: #fff; }
  .switcher .label {
    display: flex; align-items: center; padding: 0 12px; white-space: nowrap;
    min-width: 176px; justify-content: center; letter-spacing: .02em;
  }
  .switcher .sep { width: 1px; background: #d4d4da; margin: 6px 3px; }

  /* ==================== A — Interpreter ====================
     Messaging metaphor. Mode is a segmented control at the top; the one big
     button below is the whole interaction in both modes.                     */
  .v-a { --status: #fff; background: #0b0b0f; color: #f5f5f7; }
  .v-a .a-top { flex: none; padding: 4px 22px 10px; }
  .v-a .a-pair {
    display: flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 650; letter-spacing: -.01em;
  }
  .v-a .a-pair .arrow { color: #f0a33c; font-size: 13px; }
  .v-a .a-sub { margin-top: 2px; font-size: 11.5px; color: #6f6f7d; }
  .v-a .a-seg {
    flex: none; margin: 0 22px 12px; display: grid; grid-template-columns: 1fr 1fr;
    gap: 3px; padding: 3px; background: #14141a; border: 1px solid #21212b; border-radius: 12px;
  }
  .v-a .a-seg button {
    border: 0; background: transparent; color: #7c7c8a; cursor: pointer;
    padding: 9px 0; border-radius: 9px; font: 600 13px/1 inherit; letter-spacing: -.01em;
  }
  .v-a .a-seg button.on { background: #26262f; color: #f5f5f7; }
  .v-a .a-file {
    flex: none; margin: 0 22px 10px; padding: 11px 14px; border-radius: 14px;
    background: #14141a; border: 1px solid #21212b; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .v-a .a-file .n { font-size: 14px; font-weight: 600; }
  .v-a .a-file .d { font-size: 11.5px; color: #6f6f7d; margin-top: 1px; }
  .v-a .a-file .chev { color: #6f6f7d; font-size: 13px; }
  .v-a .a-src {
    flex: none; margin: 0 22px; padding: 11px 14px; border-radius: 16px;
    background: #14141a; border: 1px solid #21212b;
  }
  .v-a .a-src.hot { border-color: #4a3a1a; }
  .v-a .a-src-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: #6f6f7d;
  }
  .v-a .a-src-head .clock {
    text-transform: none; letter-spacing: .03em; font-variant-numeric: tabular-nums;
  }
  .v-a .a-src-head .rec { display: flex; align-items: center; gap: 6px; color: #e8604c; }
  .v-a .a-src-head .rec i {
    width: 7px; height: 7px; border-radius: 50%; background: #e8604c;
    animation: recblink 1.4s ease-in-out infinite;
  }
  @keyframes recblink { 50% { opacity: .25; } }
  .v-a .a-meter { display: flex; align-items: flex-end; gap: 2.5px; height: 26px; margin-top: 9px; }
  .v-a .a-meter i {
    flex: 1; min-height: 2px; border-radius: 2px; background: #33333f;
    transition: height .07s linear, background .12s linear;
  }
  .v-a .a-src-note { margin-top: 8px; font-size: 11px; line-height: 1.45; color: #55555f; }
  .v-a .a-scroll {
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    padding: 16px 22px 6px; display: flex; flex-direction: column; justify-content: flex-end; gap: 9px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 62px);
    mask-image: linear-gradient(to bottom, transparent, #000 62px);
  }
  .v-a .a-bubble {
    align-self: flex-start; max-width: 96%;
    background: #17171f; border: 1px solid #23232e; border-radius: 18px 18px 18px 6px;
    padding: 11px 15px; font-size: 16.5px; line-height: 1.42; letter-spacing: -.012em;
    color: #4f4f5c;
  }
  .v-a .a-bubble.live { color: #f5f5f7; background: #1e1a13; border-color: #4a3a1a; }
  .v-a .a-bubble.done { color: #9a9aa8; }
  .v-a .a-caret {
    display: inline-block; width: 2px; height: 1.05em; margin-left: 2px;
    background: #f0a33c; vertical-align: -.16em; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .v-a .a-foot { flex: none; padding: 6px 22px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .v-a .a-chip {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
    background: #14141a; border: 1px solid #21212b; font-size: 12.5px; color: #a6a6b4; cursor: pointer;
  }
  .v-a .a-chip b { color: #f0a33c; font-weight: 700; }
  .v-a .a-chip.warn b { color: #e8604c; }
  .v-a .a-drawer {
    width: 100%; display: none; grid-template-columns: 1fr 1fr; gap: 1px;
    background: #21212b; border: 1px solid #21212b; border-radius: 14px; overflow: hidden;
  }
  .v-a .a-drawer.open { display: grid; }
  .v-a .a-cell { background: #14141a; padding: 9px 12px; }
  .v-a .a-cell span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #62626e; }
  .v-a .a-cell strong { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .v-a .a-btn {
    position: relative; width: 82px; height: 82px; border: 0; padding: 0; border-radius: 50%;
    background: #f0a33c; cursor: pointer; display: grid; place-items: center;
  }
  .v-a .a-btn.rec { background: #e8604c; }
  .v-a .a-btn.playing { background: #1c1c24; box-shadow: 0 0 0 8px rgba(240,163,60,.09); }
  .v-a .a-btn.playing.rec { box-shadow: 0 0 0 8px rgba(232,96,76,.12); }
  /* direct child only — the icon is a nested svg and must not be positioned */
  .v-a .a-btn > svg { position: absolute; inset: -8px; width: 98px; height: 98px; transform: rotate(-90deg); }
  .v-a .a-btn .ring { fill: none; stroke: #f0a33c; stroke-width: 3; stroke-linecap: round; }
  .v-a .a-btn.rec .ring { stroke: #e8604c; }
  .v-a .a-btn .icon { position: relative; color: #0b0b0f; }
  .v-a .a-btn.playing .icon { color: #f0a33c; }
  .v-a .a-btn.playing.rec .icon { color: #e8604c; }
  /* A's picker: a rounded bottom sheet */
  .v-a .sheet {
    background: #14141a; border-top: 1px solid #2a2a35; border-radius: 22px 22px 0 0; padding: 8px 0 22px;
  }
  .v-a .sh-grab { width: 36px; height: 4px; border-radius: 2px; background: #33333f; margin: 6px auto 12px; }
  .v-a .sh-title { padding: 0 22px 4px; font-size: 16px; font-weight: 650; }
  .v-a .sh-note { padding: 0 22px 12px; font-size: 11.5px; color: #55555f; line-height: 1.45; }
  .v-a .sh-group {
    padding: 12px 22px 6px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .09em; color: #62626e;
  }
  .v-a .sh-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 22px; cursor: pointer;
  }
  .v-a .sh-row.off { opacity: .34; cursor: not-allowed; }
  .v-a .sh-row.sel { background: #1e1a13; }
  .v-a .sh-row .n { flex: 1; font-size: 14.5px; }
  .v-a .sh-row .m { font-size: 11.5px; color: #6f6f7d; font-variant-numeric: tabular-nums; }
  .v-a .sh-row .tick { color: #f0a33c; width: 14px; }

  /* ==================== B — Dual timeline ====================
     Two lanes on one clock. FILE mode is a determinate, scrubbable timeline.
     LIVE mode cannot show the future, so the lanes become a rolling window.  */
  .v-b { --status: #14141a; background: #f7f6f3; color: #14141a; }
  .v-b .b-head { flex: none; padding: 2px 20px 8px; display: flex; justify-content: space-between; align-items: flex-start; }
  .v-b .b-title { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8a8578; }
  .v-b .b-file { font-size: 16.5px; font-weight: 650; letter-spacing: -.02em; margin-top: 1px; cursor: pointer; }
  .v-b .b-file .chev { color: #b3ac9c; font-size: 12px; margin-left: 3px; }
  .v-b .b-tabs { display: flex; gap: 0; border: 1px solid #ddd8cb; border-radius: 8px; overflow: hidden; }
  .v-b .b-tabs button {
    border: 0; background: #efeade; color: #8a8578; cursor: pointer;
    padding: 7px 11px; font: 700 10.5px/1 inherit; letter-spacing: .07em; text-transform: uppercase;
  }
  .v-b .b-tabs button.on { background: #14141a; color: #f7f6f3; }
  .v-b .b-kpis { flex: none; display: flex; margin: 2px 20px 12px; border-top: 1px solid #e2ded4; border-bottom: 1px solid #e2ded4; }
  .v-b .b-kpi { flex: 1; padding: 9px 0; }
  .v-b .b-kpi + .b-kpi { border-left: 1px solid #e2ded4; padding-left: 12px; }
  .v-b .b-kpi span { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: #9a9486; }
  .v-b .b-kpi strong { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .v-b .b-kpi strong i { font-size: 11px; font-style: normal; font-weight: 600; color: #9a9486; margin-left: 1px; }
  .v-b .b-kpi.ok strong { color: #2f7d68; }
  .v-b .b-lanes { flex: none; padding: 0 20px; }
  .v-b .b-lane-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: #8a8578; margin-bottom: 4px;
  }
  .v-b .b-lane-label em { font-style: normal; text-transform: none; letter-spacing: 0; color: #b3ac9c; font-size: 10.5px; }
  .v-b canvas { display: block; width: 100%; }
  .v-b .b-gap {
    margin: 10px 20px 0; padding: 9px 12px; border-radius: 10px;
    background: #efeade; border-left: 3px solid #c8632f; font-size: 11.5px; line-height: 1.45; color: #5c554a;
  }
  .v-b .b-gap b { color: #c8632f; font-variant-numeric: tabular-nums; }
  .v-b .b-ribbon {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; margin: 12px 20px 0;
    font-size: 16px; line-height: 1.5; letter-spacing: -.01em; color: #d6d0c2;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 20px, #000 78%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 20px, #000 78%, transparent);
  }
  .v-b .b-ribbon .w { transition: color .2s; }
  .v-b .b-ribbon .w.past { color: #6b6558; }
  /* a live session cannot show words that have not been decoded yet */
  .v-b .b-ribbon .w.future { display: none; }
  .v-b .b-ribbon .w.now { color: #14141a; font-weight: 650; background: #f5e2b8; border-radius: 3px; }
  .v-b .b-scrub { flex: none; padding: 12px 20px 24px; }
  .v-b .b-track {
    position: relative; height: 32px; border-radius: 10px; background: #eae5d9;
    cursor: pointer; overflow: hidden; touch-action: none;
  }
  .v-b .b-track.live { cursor: default; background: #efeade; }
  .v-b .b-fill { position: absolute; inset: 0 auto 0 0; background: #14141a; }
  .v-b .b-knob { position: absolute; top: 0; bottom: 0; width: 3px; background: #c8632f; }
  /* LIVE mode replaces the scrubber with a keeping-up gauge */
  .v-b .b-gauge { position: absolute; inset: 0; padding: 0; }
  .v-b .b-gauge .bar { position: absolute; inset: 0 auto 0 0; background: #2f7d68; }
  .v-b .b-gauge .thresh { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #c8632f; }
  .v-b .b-gauge .txt {
    position: absolute; inset: 0; display: flex; align-items: center; padding: 0 10px;
    justify-content: space-between;
    font: 700 10.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .05em;
  }
  .v-b .b-gauge .txt span:first-child { color: #f7f6f3; }
  .v-b .b-gauge .txt span:last-child { color: #8a8578; }
  .v-b .b-scrub-meta {
    display: flex; justify-content: space-between; margin-top: 6px;
    font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a8578;
    font-variant-numeric: tabular-nums;
  }
  .v-b .b-live-cta { flex: none; padding: 12px 20px 24px; }
  .v-b .b-live-cta button {
    width: 100%; padding: 15px; border-radius: 12px; border: 0; cursor: pointer;
    background: #14141a; color: #f7f6f3; font: 650 14px/1 inherit; letter-spacing: -.01em;
  }
  .v-b .b-live-cta button.on { background: #c8632f; }
  /* B's picker: a technical full-height list */
  .v-b .sheet { background: #f7f6f3; border-radius: 16px 16px 0 0; padding: 18px 0 22px; }
  .v-b .sh-title { padding: 0 20px 3px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8a8578; }
  .v-b .sh-note { padding: 0 20px 10px; font-size: 11.5px; color: #9a9486; line-height: 1.45; }
  .v-b .sh-head, .v-b .sh-row {
    display: grid; grid-template-columns: 1fr 46px 46px 52px; gap: 8px; padding: 8px 20px; align-items: center;
  }
  .v-b .sh-head {
    font: 700 9.5px/1 inherit; letter-spacing: .08em; text-transform: uppercase; color: #b3ac9c;
    border-bottom: 1px solid #e2ded4;
  }
  .v-b .sh-row { font-size: 13px; border-bottom: 1px solid #efeade; cursor: pointer; font-variant-numeric: tabular-nums; }
  .v-b .sh-row.off { color: #b3ac9c; cursor: not-allowed; }
  .v-b .sh-row.sel { background: #f5e2b8; }
  .v-b .sh-row .num { text-align: right; color: #6b6558; font-size: 12px; }
  .v-b .sh-row.off .num { color: #c3bcac; }

  /* ==================== C — Teleprompter ====================
     Zero chrome once running. The idle screen is the ONLY place mode and file
     live; after that the screen is nothing but words.                        */
  .v-c { --status: #4a4a4a; background: #000; color: #fff; }
  .v-c .view { cursor: pointer; }
  .v-c .c-ring {
    position: absolute; inset: 0; border-radius: 44px; pointer-events: none; z-index: 20;
    box-shadow: inset 0 0 0 2px rgba(80,220,140,.5), inset 0 0 34px rgba(80,220,140,.16);
    opacity: .2; transition: opacity .08s linear;
  }
  .v-c .c-ring.rec {
    box-shadow: inset 0 0 0 2px rgba(232,96,76,.6), inset 0 0 34px rgba(232,96,76,.2);
  }
  .v-c .c-body {
    flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 10px 30px 0;
    display: flex; flex-direction: column; justify-content: center; gap: 18px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%);
    mask-image: linear-gradient(to bottom, transparent, #000 30%);
  }
  .v-c .c-line {
    font-weight: 600; letter-spacing: -.03em; line-height: 1.2;
    transition: color .35s, font-size .35s;
  }
  .v-c .c-line.old { font-size: 20px; color: #3a3a3a; }
  .v-c .c-line.prev { font-size: 25px; color: #6e6e6e; }
  .v-c .c-line.now { font-size: 37px; color: #fff; }
  .v-c .c-idle {
    flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: center;
    gap: 10px; padding: 0 28px; cursor: default;
  }
  .v-c .c-idle h1 { font-size: 27px; font-weight: 650; letter-spacing: -.035em; margin: 0 0 14px; text-align: center; }
  .v-c .c-choice {
    display: flex; align-items: center; gap: 14px; padding: 17px 18px; border-radius: 16px;
    border: 1px solid #1e1e1e; background: #0a0a0a; cursor: pointer;
  }
  .v-c .c-choice.on { border-color: #50dc8c; background: #08130c; }
  .v-c .c-choice .ic { color: #50dc8c; }
  .v-c .c-choice .t { flex: 1; }
  .v-c .c-choice .t b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .v-c .c-choice .t span { font-size: 12.5px; color: #6e6e6e; }
  .v-c .c-pick {
    margin-top: 4px; text-align: center; font-size: 12.5px; color: #6e6e6e;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .v-c .c-hint { margin-top: 14px; text-align: center; font-size: 12.5px; color: #4a4a4a; }
  .v-c .c-foot {

/* ---------------------------------------------------------------- real microphone

   granted, so the indeterminate UI can be judged against a real voice. Everything
   downstream of the level (text, throughput) is still the baked 2.wav replay.      */
const mic = {
  level: 0, active: false, denied: false, ctx: null, stream: null, buffer: null, analyser: null,
  async start() {
    if (this.active || this.denied) return;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 1024;
      this.buffer = new Float32Array(this.analyser.fftSize);
      this.ctx.createMediaStreamSource(this.stream).connect(this.analyser);
      this.active = true;
    } catch (error) {
      this.denied = true;
    }
  },
  stop() {
    if (this.stream) this.stream.getTracks().forEach(track => track.stop());
    if (this.ctx) this.ctx.close();
    this.stream = this.ctx = this.analyser = null;
    this.active = false; this.level = 0;
  },
  sample() {
    if (!this.active) return;
    this.analyser.getFloatTimeDomainData(this.buffer);
    let sum = 0;
    for (const v of this.buffer) sum += v * v;
    // RMS, lifted into the same 0..1 range the baked envelopes use
    this.level = clamp(Math.sqrt(sum / this.buffer.length) * 6, 0, 1);
  },
};

/* ---------------------------------------------------------------- replay engine */
const engine = {
  frame: 0, playing: false, rate: 4, mode: 'file', file: BAKED.name, listeners: [],
  toggle() {
    if (this.frame >= RUN.steps) return this.seek(0, true);
    this.playing = !this.playing;
    if (this.playing && this.mode === 'live') mic.start();
    if (!this.playing && this.mode === 'live') mic.stop();
    this.emit();
  },
  seek(frame, play) {
    this.frame = clamp(frame, 0, RUN.steps);
    if (play !== undefined) this.playing = play;
    if (!this.playing) mic.stop();
    this.emit();
  },
  setMode(mode) {
    if (mode === this.mode) return;
    this.mode = mode; this.playing = false; this.frame = 0;
    mic.stop();

  },
  setFile(name) { this.file = name; this.playing = false; this.frame = 0; mic.stop(); this.emit(); },
  emit() { const s = this.state(); for (const fn of this.listeners) fn(s); },
  state() {

    const step = Math.min(RUN.steps, Math.floor(this.frame));
    const sourceFrame = Math.min(RUN.sourceFrames - 1, step);
    const audioFrame = clamp(step - 2, 0, RUN.writtenFrames - 1);
    const baked = step <= RUN.sourceFrames ? RUN.sourceEnvelope[sourceFrame] : 0;
    return {
      raw: this.frame, step, sourceFrame, audioFrame, live,
      mode: this.mode, file: this.file, playing: this.playing,
      done: step >= RUN.steps,
      started: step > 0,
      // no total in live mode — nothing downstream may draw a progress bar
      total: live ? null : RUN.steps,

      micLive: live && mic.active,

      tgtLevel: step > 1 ? RUN.targetEnvelope[audioFrame] : 0,
      tokens: RUN.tokens.filter(t => t[0] <= step),

requestAnimationFrame(function loop(now) {

    if (engine.frame >= RUN.steps) { engine.frame = RUN.steps; engine.playing = false; mic.stop(); }

function sheet(root, inner) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet">${inner}</div>`;
  wrap.addEventListener('click', event => {
    if (event.target === wrap) wrap.classList.remove('open');
  });
  wrap.querySelectorAll('[data-file]').forEach(row => {
    row.addEventListener('click', () => {
      if (row.classList.contains('off')) return;
      engine.setFile(row.dataset.file);
      wrap.classList.remove('open');
      remount();
    });
  });
  root.appendChild(wrap);
  return wrap;
}

      <canvas id="b-tgt"></canvas>
    </div>
    <div class="b-gap" id="b-gap"></div>
    <div class="b-ribbon" id="b-ribbon"></div>
    ${live ? `
      <div class="b-scrub">
        <div class="b-track live">
          <div class="b-gauge">
            <div class="bar" id="b-gbar"></div>
            <div class="thresh" id="b-gneed"></div>
            <div class="txt">
              <span>${fmt1(RUN.stepsPerSecond)} steps/s</span>
              <span>needs ${fmt1(RUN.realTimeStepsPerSecond)}</span>
            </div>
          </div>
        </div>
        <div class="b-scrub-meta">
          <span id="b-pos">step 0</span><span id="b-time">0.0s elapsed</span>
        </div>
      </div>
      <div class="b-live-cta"><button id="b-cta">Start listening</button></div>` : `
      <div class="b-scrub">
        <div class="b-track" id="b-track">
          <div class="b-fill" id="b-fill"></div>
          <div class="b-knob" id="b-knob"></div>
        </div>
        <div class="b-scrub-meta">
          <span id="b-pos">step 0 / ${RUN.steps}</span>
          <span id="b-time">0.0s model · 0.0s compute</span>
        </div>
      </div>`}`;

  root.querySelectorAll('[data-mode]').forEach(button => {
    button.classList.toggle('on', button.dataset.mode === engine.mode);
    button.onclick = () => engine.setMode(button.dataset.mode);
  });

  if (!live) {
    const picker = sheet(root, `
      <div class="sh-title">Source recording</div>
      <div class="sh-note">Real durations and rates from the repo. Only ${BAKED.name} has a baked run here.</div>
      <div class="sh-head"><span>File</span><span class="num">Secs</span><span class="num">Frames</span><span class="num">Rate</span></div>
      ${RUN.files.map(f => `
        <div class="sh-row ${pickable(f) ? '' : 'off'} ${f.name === engine.file ? 'sel' : ''}" data-file="${f.name}">
          <span>${f.name}</span>
          <span class="num">${fmt1(f.seconds)}</span>
          <span class="num">${f.frames}</span>
          <span class="num">${f.rate / 1000}k</span>
        </div>`).join('')}`);
    root.querySelector('#b-file').onclick = () => picker.classList.add('open');
  } else {
    root.querySelector('#b-cta').onclick = () => engine.toggle();
  }

  const lane = (canvas, envelope, ink, h) => {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return (step, from, to) => {
      ctx.clearRect(0, 0, w, h);
      const span = to - from, bw = w / span;
      const first = Math.max(0, from), last = Math.min(envelope.length, to);
      for (let i = first; i < last; i++) {
        const v = Math.max(.012, envelope[i]);
        const barHeight = v * (h - 6);
        ctx.fillStyle = i <= step ? ink : '#ddd8cb';
        ctx.fillRect(((i - from) / span) * w, (h - barHeight) / 2, Math.max(.7, bw - .45), barHeight);
      }
      const x = clamp(((step - from) / span) * w, 0, w - 1.5);
      ctx.fillStyle = '#c8632f';
      ctx.fillRect(x, 0, 1.5, h);
    };
  };
  const drawSrc = lane(root.querySelector('#b-src'), RUN.sourceEnvelope, '#14141a', 74);
  const drawTgt = lane(root.querySelector('#b-tgt'), RUN.targetEnvelope, '#2f7d68', 74);

  const rulerCanvas = root.querySelector('#b-ruler');
  const drawRuler = (() => {
    const dpr = window.devicePixelRatio || 1;
    const w = rulerCanvas.clientWidth, h = 26;
    rulerCanvas.width = Math.round(w * dpr); rulerCanvas.height = Math.round(h * dpr);
    rulerCanvas.style.height = h + 'px';
    const ctx = rulerCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '600 9px ui-monospace, Menlo, monospace';
    return (from, to) => {
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#ddd8cb';
      ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
      const span = to - from;
      // file mode labels absolute seconds; live mode labels seconds behind now
      const ticks = live
        ? [-10, -5, 0].map(offset => ({ frame: to + offset / RUN.secondsPerFrame,
                                        text: offset === 0 ? 'now' : offset + 's' }))
        : Array.from({ length: 9 }, (_, i) => ({ frame: (i * 5) / RUN.secondsPerFrame,
                                                 text: (i * 5) + 's' }));
      for (const tick of ticks) {
        const x = clamp(((tick.frame - from) / span) * w, 0, w - 26);
        ctx.strokeStyle = '#ccc6b6';
        ctx.beginPath(); ctx.moveTo(x, h / 2 - 4); ctx.lineTo(x, h / 2 + 4); ctx.stroke();
        ctx.fillStyle = '#a8a193';
        ctx.fillText(tick.text, x + 3, h / 2 - 6);
      }
    };
  })();

  if (!live) {
    const track = root.querySelector('#b-track');
    const seekTo = event => {
      const box = track.getBoundingClientRect();
      engine.seek(((event.clientX - box.left) / box.width) * RUN.steps, false);
    };
    track.addEventListener('pointerdown', event => {
      track.setPointerCapture(event.pointerId); seekTo(event);
    });
    track.addEventListener('pointermove', event => {
      if (track.hasPointerCapture(event.pointerId)) seekTo(event);
    });
  }

  const ribbon = root.querySelector('#b-ribbon');
  ribbon.innerHTML = RUN.tokens
    .map(([frame, word], i) => `<span class="w" data-i="${i}">${word} </span>`).join('');
  const spans = [...ribbon.querySelectorAll('.w')];

  return function update(s) {
    const from = s.live ? s.step - WINDOW : 0;
    const to = s.live ? s.step : RUN.steps;
    drawSrc(s.step, from, to); drawTgt(s.step, from, to); drawRuler(from, to);

    root.querySelector('#b-kpis').innerHTML = s.live
      ? kpi([['Elapsed', fmt1(s.modelTime), 's', false], ['Steps', String(s.step), '', false],
             ['Margin', fmt1(HEADROOM), '×', true]])
      : kpi([['Audio', fmt1(RUN.sourceSeconds), 's', false],
             ['Wall clock', fmt1(RUN.elapsedSeconds), 's', false],
             ['Real time', fmt1(HEADROOM), '×', false]]);

    root.querySelector('#b-out-meta').textContent = s.live
      ? `${s.step > 1 ? s.audioFrame + 1 : 0} frames decoded`
      : `${s.step > 1 ? s.audioFrame + 1 : 0} / ${RUN.writtenFrames} frames decoded`;

    root.querySelector('#b-gap').innerHTML = s.live
      ? `Output trails input by the <b>2 frames</b> seven delayed codebooks cost, plus the
         context Hibiki banks before speaking — <b>${fmt1(ONSET_FRAMES * RUN.secondsPerFrame)}s</b> on this voice.`
      : `First French speech at <b>${fmt1(RUN.firstVoicedSource * RUN.secondsPerFrame)}s</b>,
         first English at <b>${fmt1(RUN.firstVoicedTarget * RUN.secondsPerFrame)}s</b> —
         Hibiki banks <b>${fmt1(ONSET_FRAMES * RUN.secondsPerFrame)}s</b> of context, then never falls behind again.`;

    if (s.live) {
      const gauge = root.querySelector('#b-gbar');
      const ceiling = RUN.stepsPerSecond * 1.35;
      gauge.style.width = (RUN.stepsPerSecond / ceiling * 100) + '%';
      root.querySelector('#b-gneed').style.left = (RUN.realTimeStepsPerSecond / ceiling * 100) + '%';
      root.querySelector('#b-pos').textContent = `step ${s.step}`;
      root.querySelector('#b-time').textContent = `${fmt1(s.modelTime)}s elapsed`;
      const cta = root.querySelector('#b-cta');
      cta.textContent = s.playing ? 'Stop' : s.done ? 'Start again' : 'Start listening';
      cta.classList.toggle('on', s.playing);
    } else {
      root.querySelector('#b-fill').style.width = (s.progress * 100) + '%';
      root.querySelector('#b-knob').style.left = (s.progress * 100) + '%';
      root.querySelector('#b-pos').textContent = `step ${s.step} / ${RUN.steps}`;
      root.querySelector('#b-time').textContent =
        `${fmt1(s.modelTime)}s model · ${fmt1(s.computeTime)}s compute`;
    }

    const cutoff = s.tokens.length - 1;
    spans.forEach((span, i) => {
      span.className = 'w' + (i > cutoff ? (s.live ? ' future' : '')
        : i >= cutoff - 3 ? ' now' : ' past');
    });
    // keep the live word about two thirds down the ribbon
    const liveSpan = spans[clamp(cutoff, 0, spans.length - 1)];
    if (liveSpan) {
      ribbon.scrollTop = Math.max(
        0, liveSpan.offsetTop + liveSpan.offsetHeight - ribbon.clientHeight * 0.66);
    }
  };
}
const kpi = rows => rows.map(([k, v, unit, ok]) =>
  `<div class="b-kpi${ok ? ' ok' : ''}"><span>${k}</span><strong>${v}<i>${unit}</i></strong></div>`).join('');

/* ================================================================ C — Teleprompter */
function variantC(root) {
  const live = engine.mode === 'live';
  const chosen = fileByName(engine.file);
  root.innerHTML = `
    <div class="c-ring ${live ? 'rec' : ''}" id="c-ring"></div>
    <div class="c-body" id="c-body"></div>
    <div class="c-foot">
      <span id="c-left">on device · 1B</span>
      <span id="c-right"></span>
    </div>`;
  // the whole screen is the tap target, but not while the idle chooser is up
  root.onclick = event => {
    if (event.target.closest('.c-idle, .sheet-wrap')) return;
    engine.toggle();
  };

  const picker = sheet(root, `
    <div class="sh-title">Only ${BAKED.name} has a baked run in this prototype</div>
    ${RUN.files.map(f => `
      <div class="sh-row ${pickable(f) ? '' : 'off'} ${f.name === engine.file ? 'sel' : ''}" data-file="${f.name}">
        <span>${f.name}</span><span class="m">${fmt1(f.seconds)}s</span>
      </div>`).join('')}`);

  const body = root.querySelector('#c-body');
  const ring = root.querySelector('#c-ring');
  let renderedWords = -1, wasIdle = null;

  return function update(s) {
    ring.style.opacity = .2 + clamp(s.level, 0, 1) * .8;

    const idle = !s.tokens.length;
    if (idle) {
      if (wasIdle !== true) {
        wasIdle = true; renderedWords = -1;
        // mode and file live ONLY here — once words start, the screen is just words
        body.innerHTML = s.started ? `
          <div class="c-line prev">Listening…</div>
          <div class="c-line now">${s.live ? 'Speak French.' : 'Starting.'}</div>` : `
          <div class="c-idle">
            <h1>Translate French</h1>
            <div class="c-choice ${!s.live ? 'on' : ''}" data-choose="file">
              <span class="ic">${iconWave()}</span>
              <span class="t"><b>Play a recording</b><span>${chosen.name} · ${fmt1(chosen.seconds)}s</span></span>
            </div>
            <div class="c-choice ${s.live ? 'on' : ''}" data-choose="live">
              <span class="ic">${iconMic()}</span>
              <span class="t"><b>Speak</b><span>listen to the microphone</span></span>
            </div>
            <div class="c-pick" id="c-pick" style="visibility:${s.live ? 'hidden' : 'visible'}">Choose a different file</div>
            <div class="c-hint">Then tap anywhere to start</div>
          </div>`;
        body.querySelectorAll('[data-choose]').forEach(choice => {
          choice.onclick = () => engine.setMode(choice.dataset.choose);
        });
        const pick = body.querySelector('#c-pick');
        if (pick) pick.onclick = () => picker.classList.add('open');
      }
      root.querySelector('#c-left').textContent = s.live ? 'microphone' : chosen.name;
      root.querySelector('#c-right').innerHTML = s.live
        ? '<b class="rec">live</b>' : `<b>${fmt1(HEADROOM)}×</b> real time`;
      return;
    }
    wasIdle = false;

    if (s.tokens.length !== renderedWords) {
      renderedWords = s.tokens.length;
      const spoken = SENTENCES.filter(x => x.words[0][0] <= s.step);
      const visible = spoken.slice(-4);
      body.innerHTML = visible.map((sentence, i) => {
        const fromEnd = visible.length - 1 - i;
        const shown = sentence.words.filter(w => w[0] <= s.step).map(w => w[1]).join(' ');
        return `<div class="c-line ${fromEnd === 0 ? 'now' : fromEnd === 1 ? 'prev' : 'old'}">${shown}</div>`;
      }).join('');
    }
    root.querySelector('#c-left').textContent = `${fmt1(s.modelTime)}s · ${s.tokens.length} words`;
    root.querySelector('#c-right').innerHTML = s.live
      ? `<b class="rec">●</b> ${fmt1(RUN.stepsPerSecond)}/s`
      : `<b>${fmt1(HEADROOM)}×</b> real time`;
  };
}
const iconWave = () => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2M8 7v10M12 4v16M16 8v8M21 12h-2"/></svg>`;

/* ================================================================ D — Dev console */
function variantD(root) {
  const live = engine.mode === 'live';
  const chosen = fileByName(engine.file);
  root.innerHTML = `
    <div class="d-head">
      <div class="d-cmd" id="d-cmd">python -m <b>hibiki_mlx</b> ${live
        ? '<u>--mic</u>' : `<u>${chosen.name}</u> out.wav`}</div>
      <div class="d-badge">${live ? 'MIC · LIVE' : 'BF16 · MLX'}</div>
    </div>
    <div class="d-grid" id="d-grid"></div>
    <div class="d-pipe">
      <div class="d-sec"><span>Step pipeline</span><span>${fmt1(1000 / RUN.stepsPerSecond)} ms/step avg</span></div>
      <div class="d-stages" id="d-stages">
        <div class="d-stage">encode<b>mimi</b></div>
        <div class="d-stage">generate<b>hibiki</b></div>
        <div class="d-stage">decode<b>mimi</b></div>
        <div class="d-stage">text<b>sp</b></div>
      </div>
      <div class="d-delay">
        <span class="box" id="d-sf">src 0</span>→
        <span class="box" id="d-tf">text 0</span>→
        <span class="box" id="d-af">audio —</span>
        <span style="margin-left:auto">2-frame codebook delay</span>
      </div>
    </div>
    ${live ? `
      <div class="d-margin">
        <div class="d-sec"><span>Real-time margin</span><span>${fmt1(HEADROOM)}× headroom</span></div>
        <div class="d-bar">
          <div class="fill" id="d-fill"></div>
          <div class="need" id="d-need"></div>
          <div class="lbl">
            <span>${fmt1(RUN.stepsPerSecond)} steps/s</span>
            <span>${fmt1(RUN.realTimeStepsPerSecond)} needed</span>
          </div>
        </div>
      </div>` : ''}
    <div class="d-term" id="d-term"></div>
    <div class="d-run"><button id="d-run">▶ RUN</button></div>`;

  const picker = sheet(root, `
    <div class="sh-title">argv[1] — input</div>
    <div class="sh-note">Real durations, frame counts and rates from the repo. 48 kHz files are
      resampled by read_pcm. Only ${BAKED.name} has a baked run in this prototype.</div>
    ${RUN.files.map((f, i) => `
      <div class="sh-row ${pickable(f) ? '' : 'off'} ${f.name === engine.file ? 'sel' : ''}" data-file="${f.name}">
        <span class="i">[${i + 1}]</span><span>${f.name}</span>
        <span class="m">${fmt1(f.seconds)}s</span><span class="m">${f.rate / 1000}kHz</span>
      </div>`).join('')}
    <div class="sh-row off"><span class="i">[m]</span><span>--mic</span>
      <span class="m">live</span><span class="m">24kHz</span></div>`);
  root.querySelector('#d-cmd').onclick = () => {
    if (live) engine.setMode('file'); else picker.classList.add('open');
  };

  const stages = [...root.querySelectorAll('.d-stage')];
  const term = root.querySelector('#d-term');
  const runBtn = root.querySelector('#d-run');
  runBtn.onclick = () => engine.toggle();
  if (live) {
    const ceiling = RUN.stepsPerSecond * 1.35;
    root.querySelector('#d-fill').style.width = (RUN.stepsPerSecond / ceiling * 100) + '%';
    root.querySelector('#d-need').style.left = (RUN.realTimeStepsPerSecond / ceiling * 100) + '%';
  }

  const tag = text => `<div class="ln"><span class="tag">[hibiki]</span> ${text}</div>`;
  let renderedWords = -1, renderedDone = null;

  return function update(s) {
    root.querySelector('#d-grid').innerHTML = s.live
      ? dcells([['Elapsed', fmt1(s.modelTime), 's', false], ['Steps', String(s.step), '', false],
                ['Frames in', String(s.step), '', false],
                ['Chunk buffer', '< 1', 'f', false],
                ['Throughput', fmt1(RUN.stepsPerSecond), '/s', false],
                ['Margin', fmt1(HEADROOM), '×', true]])
      : dcells([['Audio in', fmt1(RUN.sourceSeconds), 's', false],
                ['Src frames', String(RUN.sourceFrames), '', false],
                ['Steps', String(s.step), '/' + RUN.steps, false],
                ['Wall clock', fmt1(s.computeTime), 's', false],
                ['Throughput', fmt1(RUN.stepsPerSecond), '/s', false],
                ['Headroom', fmt1(HEADROOM), '×', true]]);

    root.querySelector('#d-sf').textContent =
      `src ${s.live || s.step < RUN.sourceFrames ? s.sourceFrame : '—'}`;
    root.querySelector('#d-tf').textContent = `text ${s.step}`;
    root.querySelector('#d-af').textContent = `audio ${s.step > 1 ? s.audioFrame : '—'}`;
    runBtn.textContent = s.playing
      ? (s.live ? '■ STOP' : '■ STOP')
      : s.done ? '⟲ RUN AGAIN' : (s.live ? '▶ LISTEN' : '▶ RUN');
    runBtn.classList.toggle('on', s.playing);

    const active = s.playing ? Math.floor(engine.frame * 4) % 4 : -1;
    stages.forEach((stage, i) => stage.classList.toggle('on', i === active));

    if (s.tokens.length !== renderedWords || s.done !== renderedDone) {
      renderedWords = s.tokens.length; renderedDone = s.done;
      // live-mode lines are PROPOSED copy — the CLI has no capture path yet
      const head = s.live
        ? tag(RUN.logLines[0]) + tag(RUN.logLines[1]) +
          `<div class="ln prop"><span class="tag">[hibiki]</span> listening on the default input device</div>` +
          `<div class="ln prop"><span class="tag">[hibiki]</span> streaming 80 ms frames, no total known</div>`
        : RUN.logLines.slice(0, 4).map(tag).join('');
      const text = s.tokens.length
        ? `<div class="ln out">${s.tokens.map(t => t[1]).join(' ')}</div>` : '';
      const tail = s.done
        ? (s.live
            ? `<div class="ln prop"><span class="tag">[hibiki]</span> stopped: ${s.step} steps, ${fmt1(s.modelTime)}s captured</div>`
            : RUN.logLines.slice(4).map(tag).join('')) +
          tag(`<span class="dim">${TAIL_STEPS} finalization steps · per-step timings need --metrics</span>`)
        : '';
      term.innerHTML = head + text + tail;
    }
  };
}
const dcells = rows => rows.map(([k, v, unit, hi]) =>
  `<div class="d-cell${hi ? ' hi' : ''}"><span>${k}</span><strong>${v}<i>${unit}</i></strong></div>`).join('');

/* ---------------------------------------------------------------- switcher wiring */
const VARIANTS = {
  A: { name: 'Interpreter',   build: variantA },
  B: { name: 'Dual timeline', build: variantB },
  C: { name: 'Teleprompter',  build: variantC },
  D: { name: 'Dev console',   build: variantD },
};
const KEYS = Object.keys(VARIANTS);
const view = document.getElementById('view');
const screenEl = document.querySelector('.screen');
let current = null;

function mount(key) {
  if (!VARIANTS[key]) key = 'A';
  current = key;
  const url = new URL(location.href);
  url.searchParams.set('variant', key);
  url.searchParams.set('mode', engine.mode);
  history.replaceState(null, '', url);

  engine.listeners.length = 0;
  // theme lives on .screen so the shared status bar picks up the variant's background
  screenEl.className = 'screen v-' + key.toLowerCase();
  const update = VARIANTS[key].build(view);
  engine.listeners.push(update);
  document.getElementById('vlabel').textContent = `${key} — ${VARIANTS[key].name}`;
  paintModes();
  engine.emit();
}
const remount = () => mount(current);
const cycle = delta => mount(KEYS[(KEYS.indexOf(current) + delta + KEYS.length) % KEYS.length]);

document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('reset').onclick = () => engine.seek(0, false);

const modeBox = document.getElementById('modes');
modeBox.innerHTML = [['file', 'file'], ['live', 'live']]
  .map(([m, label]) => `<button data-m="${m}" title="input mode (M)">${label}</button>`).join('');
function paintModes() {
  [...modeBox.children].forEach(b => b.classList.toggle('on', b.dataset.m === engine.mode));
}
modeBox.onclick = event => { if (event.target.dataset.m) engine.setMode(event.target.dataset.m); };

const rateBox = document.getElementById('rate');
rateBox.innerHTML = [1, 4, 12].map(r => `<button data-r="${r}">${r}×</button>`).join('');
const paintRate = () => [...rateBox.children]
  .forEach(b => b.classList.toggle('on', +b.dataset.r === engine.rate));
rateBox.onclick = event => {
  if (!event.target.dataset.r) return;
  engine.rate = +event.target.dataset.r; paintRate();
};
paintRate();

addEventListener('keydown', event => {
  const tag = (event.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || event.target.isContentEditable) return;
  if (event.key === 'ArrowLeft') cycle(-1);
  else if (event.key === 'ArrowRight') cycle(1);
  else if (event.key === 'm' || event.key === 'M') engine.setMode(engine.mode === 'file' ? 'live' : 'file');
  else if (event.key === ' ') { event.preventDefault(); engine.toggle(); }
});

/* scale the device down on short windows so the whole screen stays visible */
const fit = document.querySelector('.fit');
const device = document.querySelector('.device');
function resize() {
  const scale = Math.min(1, (window.innerHeight - 215) / 852, (window.innerWidth - 32) / 393);
  device.style.transform = `scale(${scale})`;
  fit.style.height = (852 * scale) + 'px';
}
addEventListener('resize', () => { resize(); remount(); });
resize();

const params = new URLSearchParams(location.search);
if (params.get('mode') === 'live') engine.mode = 'live';
mount(params.get('variant') || 'A');
// ?frame=300&play=1 — deep-link a moment in the run, handy for screenshots
if (params.has('frame')) engine.seek(Number(params.get('frame')) || 0, params.get('play') === '1');
else if (params.get('play') === '1') engine.seek(0, true);
</script>
</body>
</html>
